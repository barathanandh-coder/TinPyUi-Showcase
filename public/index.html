<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Showcase - TinPyUI</title>
    <!-- TinPyUI Bootstrap — do not edit this file. Edit main.tin instead. -->
    <script src="wasm_exec.js"></script>
    <script>
        const go = new Go();
        WebAssembly.instantiateStreaming(fetch("app.wasm"), go.importObject)
            .then(result => {
                go.run(result.instance);

                const boot = () => {
                    fetch("app.ir.json")
                        .then(res => res.text())
                        .then(ir => {
                            try {
                                const ret = BootTinUI(ir);
                                if (ret) console.log(ret);
                            } catch (e) {
                                console.error("TinUI Boot Error:", e);
                                document.getElementById("tinui-root").innerHTML =
                                    "<div style='padding:20px;color:#ff5555;'>TinUI Error: " + e.message + "</div>";
                            }
                        })
                        .catch(err => {
                            console.error("Failed to load app.ir.json:", err);
                            document.getElementById("tinui-root").innerHTML =
                                "<div style='padding:20px;color:#ff5555;'>Failed to load app.ir.json: " + err.message + "</div>";
                        });
                };

                if (document.readyState === "loading") {
                    document.addEventListener("DOMContentLoaded", boot);
                } else {
                    boot();
                }
            })
            .catch(err => {
                console.error("WASM Boot Error:", err);
                const showErr = () => {
                    document.getElementById("tinui-root").innerHTML =
                        "<div style='padding:20px;color:#ff5555;'>Failed to start WebAssembly engine: " + err.message + "</div>";
                };
                if (document.readyState === "loading") {
                    document.addEventListener("DOMContentLoaded", showErr);
                } else {
                    showErr();
                }
            });
    </script>
</head>
<body style="margin:0;padding:0;background:#0a0b10;">
    <div id="tinui-root"></div>
</body>
</html>
